<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Battle Cards - Demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo">The Battle Cards</div>
    <button id="menuToggle" class="house-btn" aria-label="Open menu">🏠</button>
  </header>

  <aside id="sidePanel" class="side-panel">
    <button>Base</button>
    <button>Cards</button>
    <button>Team</button>
    <button>Bag</button>
    <button id="resetBtn">Exit</button>
    <button disabled>Locked</button>
  </aside>

  <main>
    <section class="status-row">
      <div class="minimap">Mini Map</div>
      <div>
        <div id="phaseText">Player Turn</div>
        <div id="roundText">Round 1</div>
      </div>
    </section>

    <section class="battlefield">
      <h2>Battlefield (Vertical Face-off)</h2>
      <div>
        <h3>Enemy Team</h3>
        <div id="enemyGrid" class="team-board"></div>
      </div>
      <div class="center-line">⚔️</div>
      <div>
        <h3>Player Team</h3>
        <div id="playerGrid" class="team-board"></div>
      </div>
    </section>

    <section class="controls">
      <button id="endTurnBtn">End Turn</button>
      <button id="restartBtn">Restart Demo</button>
    </section>

    <section>
      <h3>Battle Log</h3>
      <div id="log" class="log"></div>
    </section>
  </main>

  <script src="battle-demo.js"></script>
</body>
</html>
